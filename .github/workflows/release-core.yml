name: Store candidate core

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate candidate tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build_name: ${{ steps.version.outputs.build_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      release_name: ${{ steps.version.outputs.release_name }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag, version, and main ancestry
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Store candidate workflow must be called from a tag." >&2
            exit 1
          fi

          pubspec_version="$(
            awk '$1 == "version:" { print $2; exit }' pubspec.yaml
          )"
          if [[ ! "${pubspec_version}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([1-9][0-9]*)$ ]]; then
            echo "pubspec.yaml version must look like 1.2.3+45." >&2
            exit 1
          fi

          build_name="${BASH_REMATCH[1]}"
          build_number="${BASH_REMATCH[2]}"
          expected_tag="rc-${pubspec_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Expected tag ${expected_tag}, got ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor \
            "${tag_commit}" refs/remotes/origin/main; then
            echo "Release tag commit is not contained in main." >&2
            exit 1
          fi

          {
            printf 'build_name=%s\n' "${build_name}"
            printf 'build_number=%s\n' "${build_number}"
            printf 'release_name=%s\n' "${GITHUB_REF_NAME}"
          } >>"${GITHUB_OUTPUT}"

  android:
    name: Android to Play Internal
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment:
      name: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17.0.20+8

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.38.3
          cache: false

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager="${android_sdk_root%/}/cmdline-tools/latest/bin/sdkmanager"
          if [[ -z "${android_sdk_root}" || ! -x "${sdkmanager}" ]]; then
            echo "Android SDK manager was not found." >&2
            exit 1
          fi
          "${sdkmanager}" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" >/dev/null

      - name: Install locked Dart dependencies
        run: flutter pub get --enforce-lockfile

      - name: Fetch reviewed app configuration
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: https://github.com/sljeff
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: /app-config
          include-imports: false
          recursive: false

      - name: Materialize Android app configuration
        run: ./scripts/materialize_app_config.sh android

      - name: Clear raw app configuration
        if: always()
        shell: bash
        run: |
          {
            echo 'ANDROID_GOOGLE_SERVICES_JSON='
            echo 'IOS_GOOGLE_SERVICE_INFO_PLIST='
            echo 'FIREBASE_OPTIONS_DART='
            echo 'PURCHASES_IOS_API_KEY='
            echo 'PURCHASES_ANDROID_API_KEY='
          } >>"${GITHUB_ENV}"

      - name: Fetch Android upload signing
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: https://github.com/sljeff
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: /android-signing
          include-imports: false
          recursive: false

      - name: Prepare temporary Android signing
        run: ./scripts/prepare_android_signing.sh

      - name: Clear raw Android signing values
        if: always()
        shell: bash
        run: |
          {
            echo 'ANDROID_UPLOAD_KEYSTORE_B64='
            echo 'ANDROID_KEY_ALIAS='
            echo 'ANDROID_KEY_PASSWORD='
            echo 'ANDROID_STORE_PASSWORD='
          } >>"${GITHUB_ENV}"

      - name: Build signed app bundle
        shell: bash
        run: |
          set -euo pipefail
          flutter build appbundle \
            --release \
            --build-name "${{ needs.validate.outputs.build_name }}" \
            --build-number "${{ needs.validate.outputs.build_number }}"
          jarsigner -verify \
            build/app/outputs/bundle/release/app-release.aab >/dev/null

      - name: Remove Android build credentials
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f android/key.properties && ! -L android/key.properties ]]; then
            rm -f -- android/key.properties
          fi
          signing_dir="${RUNNER_TEMP%/}/anycast-android-signing"
          if [[ -d "${signing_dir}" &&
                "${signing_dir}" == "${RUNNER_TEMP%/}/anycast-android-signing" ]]; then
            rm -rf -- "${signing_dir}"
          fi
          rm -f -- \
            .env \
            android/app/google-services.json \
            lib/firebase_options.dart
          exit 0

      - name: Authenticate to Google Play
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false

      - name: Upload to Google Play Internal
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          AAB_PATH: build/app/outputs/bundle/release/app-release.aab
          RELEASE_NAME: ${{ needs.validate.outputs.release_name }}
        run: ./scripts/upload_play.sh

  ios:
    name: iOS to TestFlight
    needs: validate
    runs-on: macos-15
    timeout-minutes: 70
    environment:
      name: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: 16.4

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: 3.3.11
          bundler-cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.38.3
          cache: false

      - name: Verify CocoaPods toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(bundle exec pod --version)" = "1.16.2"

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          (
            cd ios
            bundle exec pod install --deployment
          )

      - name: Fetch reviewed app configuration
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: https://github.com/sljeff
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: /app-config
          include-imports: false
          recursive: false

      - name: Materialize iOS app configuration
        run: ./scripts/materialize_app_config.sh ios

      - name: Clear raw app configuration
        if: always()
        shell: bash
        run: |
          {
            echo 'ANDROID_GOOGLE_SERVICES_JSON='
            echo 'IOS_GOOGLE_SERVICE_INFO_PLIST='
            echo 'FIREBASE_OPTIONS_DART='
            echo 'PURCHASES_IOS_API_KEY='
            echo 'PURCHASES_ANDROID_API_KEY='
          } >>"${GITHUB_ENV}"

      - name: Fetch iOS distribution signing
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: https://github.com/sljeff
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: /ios-signing
          include-imports: false
          recursive: false

      - name: Fetch App Store Connect upload key
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: https://github.com/sljeff
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: /app-store-connect
          include-imports: false
          recursive: false

      - name: Prepare temporary iOS signing
        run: ./scripts/prepare_ios_signing.sh

      - name: Clear raw iOS signing values
        if: always()
        shell: bash
        run: |
          {
            echo 'IOS_DISTRIBUTION_P12_B64='
            echo 'IOS_DISTRIBUTION_P12_PASSWORD='
            echo 'IOS_RUNNER_PROFILE_B64='
            echo 'IOS_SHARE_EXTENSION_PROFILE_B64='
            echo 'APP_STORE_CONNECT_PRIVATE_KEY_B64='
          } >>"${GITHUB_ENV}"

      - name: Archive signed iOS app
        shell: bash
        run: |
          set -euo pipefail
          archive_path="${RUNNER_TEMP%/}/Anycast.xcarchive"
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "${archive_path}" \
            archive \
            DEVELOPMENT_TEAM=5TQ9AN87D8 \
            FLUTTER_BUILD_NAME="${{ needs.validate.outputs.build_name }}" \
            FLUTTER_BUILD_NUMBER="${{ needs.validate.outputs.build_number }}" \
            MARKETING_VERSION="${{ needs.validate.outputs.build_name }}" \
            CURRENT_PROJECT_VERSION="${{ needs.validate.outputs.build_number }}"

          runner_info="${archive_path}/Products/Applications/Runner.app/Info.plist"
          runner_app="${archive_path}/Products/Applications/Runner.app"
          share_app="${runner_app}/PlugIns/Share Extension.appex"
          share_info="${share_app}/Info.plist"
          for info_path in "${runner_info}" "${share_info}"; do
            test "$(plutil -extract CFBundleShortVersionString raw -o - "${info_path}")" \
              = "${{ needs.validate.outputs.build_name }}"
            test "$(plutil -extract CFBundleVersion raw -o - "${info_path}")" \
              = "${{ needs.validate.outputs.build_number }}"
          done

          verify_profile_uuid() {
            local bundle_path="$1"
            local expected_uuid="$2"
            local label="$3"
            local actual_uuid

            actual_uuid="$(
              security cms -D \
                -i "${bundle_path}/embedded.mobileprovision" 2>/dev/null |
                plutil -extract UUID raw -o - -
            )"
            actual_uuid="$(
              tr '[:upper:]' '[:lower:]' <<<"${actual_uuid}"
            )"
            if [[ "${actual_uuid}" != "${expected_uuid}" ]]; then
              echo "${label} used an unexpected provisioning profile." >&2
              exit 1
            fi
          }

          verify_profile_uuid \
            "${runner_app}" \
            8556542b-9ee1-4053-87f9-7a8a939124e5 \
            Runner
          verify_profile_uuid \
            "${share_app}" \
            64282043-b776-4bbb-9f70-7b4bbc5a3a39 \
            "Share Extension"
          codesign --verify --deep --strict "${runner_app}"

          export_path="${RUNNER_TEMP%/}/anycast-ios-export"
          xcodebuild \
            -exportArchive \
            -archivePath "${archive_path}" \
            -exportPath "${export_path}" \
            -exportOptionsPlist ios/ExportOptions.plist

          ipa_path="$(find "${export_path}" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [[ -z "${ipa_path}" || ! -f "${ipa_path}" ]]; then
            echo "Xcode did not export an IPA." >&2
            exit 1
          fi

          ipa_check_path="${RUNNER_TEMP%/}/anycast-ios-ipa-check"
          mkdir -p "${ipa_check_path}"
          ditto -x -k "${ipa_path}" "${ipa_check_path}"
          exported_app="$(
            find "${ipa_check_path}/Payload" \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              -print \
              -quit
          )"
          if [[ -z "${exported_app}" || ! -d "${exported_app}" ]]; then
            echo "Exported IPA does not contain an app bundle." >&2
            exit 1
          fi
          verify_profile_uuid \
            "${exported_app}" \
            8556542b-9ee1-4053-87f9-7a8a939124e5 \
            "Exported Runner"
          verify_profile_uuid \
            "${exported_app}/PlugIns/Share Extension.appex" \
            64282043-b776-4bbb-9f70-7b4bbc5a3a39 \
            "Exported Share Extension"
          codesign --verify --deep --strict "${exported_app}"

          printf 'IOS_IPA_PATH=%s\n' "${ipa_path}" >>"${GITHUB_ENV}"

      - name: Remove iOS app configuration
        if: always()
        shell: bash
        run: |
          rm -f -- \
            .env \
            ios/Runner/GoogleService-Info.plist \
            lib/firebase_options.dart

      - name: Upload to TestFlight
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "${IOS_SIGNING_DIR}"
            xcrun iTMSTransporter \
              -m upload \
              -assetFile "${IOS_IPA_PATH}" \
              -apiKey "${APP_STORE_CONNECT_KEY_ID}" \
              -apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}"
          )

      - name: Remove iOS signing material and build
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${IOS_KEYCHAIN_PATH:-}" && -f "${IOS_KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${IOS_KEYCHAIN_PATH}"
          fi
          original_keychains_file="${RUNNER_TEMP%/}/anycast-ios-signing/original-keychains.txt"
          if [[ -f "${original_keychains_file}" ]]; then
            original_keychains=()
            while IFS= read -r keychain_path; do
              if [[ -n "${keychain_path}" ]]; then
                original_keychains+=("${keychain_path}")
              fi
            done <"${original_keychains_file}"
            if (( ${#original_keychains[@]} > 0 )); then
              security list-keychains -d user -s "${original_keychains[@]}"
            fi
          fi
          for profile_path in \
            "${IOS_RUNNER_PROFILE_PATH:-}" \
            "${IOS_SHARE_PROFILE_PATH:-}"; do
            if [[ -n "${profile_path}" && -f "${profile_path}" ]]; then
              rm -f -- "${profile_path}"
            fi
          done
          signing_dir="${RUNNER_TEMP%/}/anycast-ios-signing"
          if [[ -d "${signing_dir}" &&
                "${signing_dir}" == "${RUNNER_TEMP%/}/anycast-ios-signing" ]]; then
            rm -rf -- "${signing_dir}"
          fi
          rm -rf -- \
            "${RUNNER_TEMP%/}/Anycast.xcarchive" \
            "${RUNNER_TEMP%/}/anycast-ios-export" \
            "${RUNNER_TEMP%/}/anycast-ios-ipa-check"
          {
            echo 'APP_STORE_CONNECT_ISSUER_ID='
            echo 'APP_STORE_CONNECT_KEY_ID='
            echo 'API_PRIVATE_KEYS_DIR='
            echo 'IOS_IPA_PATH='
          } >>"${GITHUB_ENV}"
          exit 0
