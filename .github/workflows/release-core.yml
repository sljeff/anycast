name: Store candidate core

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate candidate tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build_name: ${{ steps.version.outputs.build_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      release_name: ${{ steps.version.outputs.release_name }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag, version, and main ancestry
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Store candidate workflow must be called from a tag." >&2
            exit 1
          fi

          # Version source of truth is native/project.yml (AGENTS.md):
          # MARKETING_VERSION (major.minor.patch) and
          # CURRENT_PROJECT_VERSION (build number). First quoted
          # assignment of each key wins; malformed or missing values
          # fail loudly below.
          marketing_version="$(
            sed -n -E 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"([^"]+)".*/\1/p' \
              native/project.yml | head -1
          )"
          build_version="$(
            sed -n -E 's/^[[:space:]]*CURRENT_PROJECT_VERSION:[[:space:]]*"([^"]+)".*/\1/p' \
              native/project.yml | head -1
          )"

          if [[ -z "${marketing_version}" || -z "${build_version}" ]]; then
            echo "native/project.yml must define MARKETING_VERSION and CURRENT_PROJECT_VERSION." >&2
            exit 1
          fi
          if [[ ! "${marketing_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "MARKETING_VERSION must look like 1.2.3." >&2
            exit 1
          fi
          if [[ ! "${build_version}" =~ ^[1-9][0-9]*$ ]]; then
            echo "CURRENT_PROJECT_VERSION must be a positive integer." >&2
            exit 1
          fi

          expected_tag="rc-${marketing_version}+${build_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Expected tag ${expected_tag}, got ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor \
            "${tag_commit}" refs/remotes/origin/main; then
            echo "Release tag commit is not contained in main." >&2
            exit 1
          fi

          {
            printf 'build_name=%s\n' "${marketing_version}"
            printf 'build_number=%s\n' "${build_version}"
            printf 'release_name=%s\n' "${GITHUB_REF_NAME}"
          } >>"${GITHUB_OUTPUT}"

  ios:
    name: iOS to TestFlight
    needs: validate
    runs-on: xcode-27
    timeout-minutes: 70
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    env:
      # Must match the CI workflow's pinned toolchain (Xcode 27 is the
      # only toolchain the native project is verified against).
      XCODE_VERSION: '27.0'

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::Pinned Xcode ${XCODE_VERSION} is not installed on this image; bump XCODE_VERSION as a reviewed change. Present:" >&2
            ls -d /Applications/Xcode_*.app >&2 || true
            exit 1
          fi
          export DEVELOPER_DIR="$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version | head -1 | grep -q "^Xcode ${XCODE_VERSION}" || {
            echo "::error::$XCODE_APP reports itself as $(xcodebuild -version | head -1)." >&2
            exit 1
          }

      - name: Fetch reviewed app configuration
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: https://github.com/sljeff
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: /app-config
          include-imports: false
          recursive: false

      - name: Materialize native app configuration
        run: ./scripts/materialize_app_config.sh

      - name: Clear raw app configuration
        if: always()
        shell: bash
        run: |
          {
            echo 'IOS_GOOGLE_SERVICE_INFO_PLIST='
            echo 'PURCHASES_IOS_API_KEY='
            # Legacy names the Infisical path may still carry until the
            # cutover secret cleanup lands there.
            echo 'ANDROID_GOOGLE_SERVICES_JSON='
            echo 'FIREBASE_OPTIONS_DART='
            echo 'PURCHASES_ANDROID_API_KEY='
          } >>"${GITHUB_ENV}"

      - name: Fetch iOS distribution signing
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: https://github.com/sljeff
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: /ios-signing
          include-imports: false
          recursive: false

      - name: Fetch App Store Connect upload key
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: https://github.com/sljeff
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: /app-store-connect
          include-imports: false
          recursive: false

      - name: Prepare temporary iOS signing
        run: ./scripts/prepare_ios_signing.sh

      - name: Clear raw iOS signing values
        if: always()
        shell: bash
        run: |
          {
            echo 'IOS_DISTRIBUTION_P12_B64='
            echo 'IOS_DISTRIBUTION_P12_PASSWORD='
            echo 'IOS_RUNNER_PROFILE_B64='
            echo 'IOS_SHARE_EXTENSION_PROFILE_B64='
            echo 'APP_STORE_CONNECT_PRIVATE_KEY_B64='
          } >>"${GITHUB_ENV}"

      - name: Archive signed native iOS app
        shell: bash
        run: |
          set -euo pipefail
          # Homebrew ships no versioned xcodegen formula, so the pin is a
          # post-install assertion (same pin as CI).
          brew install xcodegen
          test "$(xcodegen --version)" = "Version: 2.46.0"
          (
            cd native
            xcodegen generate
          )

          archive_path="${RUNNER_TEMP%/}/Anycast.xcarchive"
          xcodebuild \
            -project native/Anycast.xcodeproj \
            -scheme Anycast \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "${archive_path}" \
            MARKETING_VERSION="${{ needs.validate.outputs.build_name }}" \
            CURRENT_PROJECT_VERSION="${{ needs.validate.outputs.build_number }}" \
            archive

          app_path="${archive_path}/Products/Applications/Anycast.app"
          app_info="${app_path}/Info.plist"
          # The native ShareExtension target's product is ShareExtension.appex
          # (the Flutter Runner project named it "Share Extension.appex").
          share_app="${app_path}/PlugIns/ShareExtension.appex"
          share_info="${share_app}/Info.plist"
          for info_path in "${app_info}" "${share_info}"; do
            test "$(plutil -extract CFBundleShortVersionString raw -o - "${info_path}")" \
              = "${{ needs.validate.outputs.build_name }}"
            test "$(plutil -extract CFBundleVersion raw -o - "${info_path}")" \
              = "${{ needs.validate.outputs.build_number }}"
          done

          verify_profile_uuid() {
            local bundle_path="$1"
            local expected_uuid="$2"
            local label="$3"
            local actual_uuid

            actual_uuid="$(
              security cms -D \
                -i "${bundle_path}/embedded.mobileprovision" 2>/dev/null |
                plutil -extract UUID raw -o - -
            )"
            actual_uuid="$(
              tr '[:upper:]' '[:lower:]' <<<"${actual_uuid}"
            )"
            if [[ "${actual_uuid}" != "${expected_uuid}" ]]; then
              echo "${label} used an unexpected provisioning profile." >&2
              exit 1
            fi
          }

          verify_profile_uuid \
            "${app_path}" \
            8556542b-9ee1-4053-87f9-7a8a939124e5 \
            Anycast
          verify_profile_uuid \
            "${share_app}" \
            64282043-b776-4bbb-9f70-7b4bbc5a3a39 \
            "Share Extension"
          codesign --verify --deep --strict "${app_path}"

          export_path="${RUNNER_TEMP%/}/anycast-ios-export"
          xcodebuild \
            -exportArchive \
            -archivePath "${archive_path}" \
            -exportPath "${export_path}" \
            -exportOptionsPlist native/ExportOptions.plist

          ipa_path="$(find "${export_path}" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [[ -z "${ipa_path}" || ! -f "${ipa_path}" ]]; then
            echo "Xcode did not export an IPA." >&2
            exit 1
          fi

          ipa_check_path="${RUNNER_TEMP%/}/anycast-ios-ipa-check"
          mkdir -p "${ipa_check_path}"
          ditto -x -k "${ipa_path}" "${ipa_check_path}"
          exported_app="$(
            find "${ipa_check_path}/Payload" \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              -print \
              -quit
          )"
          if [[ -z "${exported_app}" || ! -d "${exported_app}" ]]; then
            echo "Exported IPA does not contain an app bundle." >&2
            exit 1
          fi
          verify_profile_uuid \
            "${exported_app}" \
            8556542b-9ee1-4053-87f9-7a8a939124e5 \
            "Exported Anycast"
          verify_profile_uuid \
            "${exported_app}/PlugIns/ShareExtension.appex" \
            64282043-b776-4bbb-9f70-7b4bbc5a3a39 \
            "Exported Share Extension"
          codesign --verify --deep --strict "${exported_app}"

          printf 'IOS_IPA_PATH=%s\n' "${ipa_path}" >>"${GITHUB_ENV}"

      - name: Remove native app configuration
        if: always()
        shell: bash
        run: |
          rm -f -- \
            native/Anycast/Resources/GoogleService-Info.plist \
            native/Anycast/Resources/Secrets.plist

      - name: Upload to TestFlight
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "${IOS_SIGNING_DIR}"
            xcrun iTMSTransporter \
              -m upload \
              -assetFile "${IOS_IPA_PATH}" \
              -apiKey "${APP_STORE_CONNECT_KEY_ID}" \
              -apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}"
          )

      - name: Remove iOS signing material and build
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${IOS_KEYCHAIN_PATH:-}" && -f "${IOS_KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${IOS_KEYCHAIN_PATH}"
          fi
          original_keychains_file="${RUNNER_TEMP%/}/anycast-ios-signing/original-keychains.txt"
          if [[ -f "${original_keychains_file}" ]]; then
            original_keychains=()
            while IFS= read -r keychain_path; do
              if [[ -n "${keychain_path}" ]]; then
                original_keychains+=("${keychain_path}")
              fi
            done <"${original_keychains_file}"
            if (( ${#original_keychains[@]} > 0 )); then
              security list-keychains -d user -s "${original_keychains[@]}"
            fi
          fi
          for profile_path in \
            "${IOS_RUNNER_PROFILE_PATH:-}" \
            "${IOS_SHARE_PROFILE_PATH:-}"; do
            if [[ -n "${profile_path}" && -f "${profile_path}" ]]; then
              rm -f -- "${profile_path}"
            fi
          done
          signing_dir="${RUNNER_TEMP%/}/anycast-ios-signing"
          if [[ -d "${signing_dir}" &&
                "${signing_dir}" == "${RUNNER_TEMP%/}/anycast-ios-signing" ]]; then
            rm -rf -- "${signing_dir}"
          fi
          rm -rf -- \
            "${RUNNER_TEMP%/}/Anycast.xcarchive" \
            "${RUNNER_TEMP%/}/anycast-ios-export" \
            "${RUNNER_TEMP%/}/anycast-ios-ipa-check"
          {
            echo 'APP_STORE_CONNECT_ISSUER_ID='
            echo 'APP_STORE_CONNECT_KEY_ID='
            echo 'API_PRIVATE_KEYS_DIR='
            echo 'IOS_IPA_PATH='
          } >>"${GITHUB_ENV}"
          exit 0
