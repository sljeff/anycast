name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-ios:
    name: Build native iOS
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      # Single source of truth for the native CI toolchain. The image's
      # default Xcode is ignored on purpose: it rolled 27.0 -> 27.1 on
      # 2026-10-23 and broke the smoke step. Upgrades are reviewed PRs
      # that bump XCODE_VERSION and SIM_OS together; a pin the image no
      # longer carries fails loudly in the provision step below.
      XCODE_VERSION: '27.0'
      # XCODE_VERSION must equal SIM_OS. A 27.1-built runner on the 27.0
      # runtime is the pairing that crashed the smoke step, and the iOS
      # 27.1 runtime supports no iPhone besides iPhone Duo — so 27.1 is
      # not a drop-in bump. 27.0 + iPhone 18 Pro is the configuration
      # every previously green CI run used. When bumping, pick a device
      # type the new runtime actually supports.
      SIM_OS: '27.0'
      SIM_DEVICE_TYPE: 'iPhone 18 Pro'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs before the build so the device's first boot overlaps
      # compilation. Everything downstream (build SDK, simulator runtime,
      # device) derives from the pins above, never from image defaults or
      # device-list ordering.
      - name: Select pinned Xcode and provision smoke simulator
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::Pinned Xcode ${XCODE_VERSION} is not installed on this image; bump XCODE_VERSION as a reviewed change. Present:" >&2
            ls -d /Applications/Xcode_*.app >&2 || true
            exit 1
          fi
          export DEVELOPER_DIR="$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          # Guard against a bundle whose directory name lies.
          xcodebuild -version | head -1 | grep -q "^Xcode ${XCODE_VERSION}" || {
            echo "::error::$XCODE_APP reports itself as $(xcodebuild -version | head -1)." >&2
            exit 1
          }
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          case "$SDK" in
            "$SIM_OS"|"$SIM_OS."*) ;;
            *) echo "::error::Xcode ${XCODE_VERSION} ships simulator SDK ${SDK}, which does not match SIM_OS=${SIM_OS}; bump them together." >&2
               exit 1 ;;
          esac
          RUNTIME_ID=$(xcrun simctl list runtimes --json \
            | jq -r --arg v "$SIM_OS" \
              '[.runtimes[] | select(.platform == "iOS" and .version == $v and .isAvailable)][0].identifier // empty')
          DEVTYPE_ID=$(xcrun simctl list devicetypes --json \
            | jq -r --arg n "$SIM_DEVICE_TYPE" \
              '[.devicetypes[] | select(.name == $n)][0].identifier // empty')
          if [ -z "$RUNTIME_ID" ] || [ -z "$DEVTYPE_ID" ]; then
            echo "::error::iOS ${SIM_OS} runtime or device type '${SIM_DEVICE_TYPE}' is missing; adjust SIM_OS / SIM_DEVICE_TYPE." >&2
            exit 1
          fi
          # Create our own device instead of adopting whatever the image
          # pre-created: immune to device-list ordering and to runtimes
          # with thin device lineups. Fails loudly if the pair cannot
          # coexist.
          UDID=$(xcrun simctl create ci-smoke "$DEVTYPE_ID" "$RUNTIME_ID" || {
            echo "::error::simctl create failed — is ${SIM_DEVICE_TYPE} supported by iOS ${SIM_OS}?" >&2
            exit 1
          })
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          # Boot now; the test steps wait for the boot to complete so
          # first-boot work stays outside the test runner's stall
          # watchdog.
          xcrun simctl boot "$UDID"

      # The Xcode 27 image is preview-only and only reachable via the
      # `xcode-27` label (there is no macos-27 label; GA macOS images top
      # out at Xcode 26) — Xcode 27 is the only toolchain the native
      # project is verified against. Revisit once a GA image ships it.
      - name: Generate synthetic app configuration
        run: ./scripts/ci_config.sh

      - name: Generate and build native targets for testing
        shell: bash
        run: |
          set -euo pipefail
          # Homebrew ships no versioned xcodegen formula, so the pin is a
          # post-install assertion: an unexpected toolchain bump fails the
          # job loudly instead of silently regenerating the project.
          brew install xcodegen
          test "$(xcodegen --version)" = "Version: 2.46.0"
          (
            cd native
            xcodegen generate
          )
          xcodebuild \
            -project native/Anycast.xcodeproj \
            -scheme Anycast \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath native/build/dd \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      # Unit-test selection: every suite whose fixtures are TRACKED in git
      # (the frozen db/opml payloads) plus the self-contained suites. The
      # L1/L2 suites that replay the live-collected corpus
      # (L1GoldenTests, L1PaletteTests, L2ContractTests,
      # L2ContractReplayTests) stay out — their payloads are gitignored
      # network captures (test/fixtures/README.md) and CI never fetches
      # the live corpus. AnycastAppTests is hosted in the app and needs
      # only the tracked opml export. The scheme pins TZ=Asia/Shanghai so
      # the G10/G11 zone-sensitive goldens are machine-independent.
      - name: Run native unit test selection
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$SIM_UDID" -b
          # Deterministic runner selection out of the shared derived data:
          # build-for-testing writes exactly one product xctestrun; exclude
          # patched copies (qa-gated / reference / *-patched) local crawl
          # runs leave behind, then sort so a second genuine product can
          # never flip the pick silently.
          XCTESTRUN=""
          for candidate in native/build/dd/Build/Products/*.xctestrun; do
            [ -f "$candidate" ] || continue
            case "$(basename "$candidate")" in
              qa-gated.xctestrun|reference.xctestrun|*-patched.*) continue ;;
            esac
            if [ -z "$XCTESTRUN" ] || [ "$candidate" \< "$XCTESTRUN" ]; then
              XCTESTRUN="$candidate"
            fi
          done
          if [ -z "$XCTESTRUN" ]; then
            echo "no .xctestrun under native/build/dd/Build/Products — did build-for-testing run?" >&2
            exit 1
          fi
          echo "using xctestrun $XCTESTRUN"
          # xcodebuild refuses to overwrite an existing result bundle.
          mkdir -p native/build/runs/ci
          rm -rf native/build/runs/ci/unit-tests.xcresult
          xcodebuild \
            -xctestrun "$XCTESTRUN" \
            -destination "id=$SIM_UDID" \
            -derivedDataPath native/build/dd \
            -resultBundlePath native/build/runs/ci/unit-tests.xcresult \
            -only-testing:AnycastTests/AssetAvailabilityTests \
            -only-testing:AnycastTests/L0DatabaseTests \
            -only-testing:AnycastTests/HistoryMigrationTests \
            -only-testing:AnycastTests/CacheStoreTests \
            -only-testing:AnycastTests/SettingsRepositoryTests \
            -only-testing:AnycastTests/AudioPolicyTests \
            -only-testing:AnycastTests/DownloadProgressStepTests \
            -only-testing:AnycastTests/HtmlTextDepthTests \
            -only-testing:AnycastTests/PlaybackStateMachineTests \
            -only-testing:AnycastTests/PollingRhythmTests \
            -only-testing:AnycastTests/ImageFitTests \
            -only-testing:AnycastTests/ShowNotesNormalizerTests \
            -only-testing:AnycastAppTests \
            test-without-building

      - name: Run native UI smoke (XCUITest, 05 §6.2)
        shell: bash
        run: |
          set -euo pipefail
          # The provision step created and started this device; wait for
          # the boot to finish so first-boot work stays outside the test
          # runner's stall watchdog.
          xcrun simctl bootstatus "$SIM_UDID" -b
          echo "using simulator $SIM_UDID"
          XCTESTRUN=""
          for candidate in native/build/dd/Build/Products/*.xctestrun; do
            [ -f "$candidate" ] || continue
            case "$(basename "$candidate")" in
              qa-gated.xctestrun|reference.xctestrun|*-patched.*) continue ;;
            esac
            if [ -z "$XCTESTRUN" ] || [ "$candidate" \< "$XCTESTRUN" ]; then
              XCTESTRUN="$candidate"
            fi
          done
          if [ -z "$XCTESTRUN" ]; then
            echo "no .xctestrun under native/build/dd/Build/Products — did build-for-testing run?" >&2
            exit 1
          fi
          echo "using xctestrun $XCTESTRUN"
          mkdir -p native/build/runs/ci
          rm -rf native/build/runs/ci/ui-smoke.xcresult
          xcodebuild \
            -xctestrun "$XCTESTRUN" \
            -destination "id=$SIM_UDID" \
            -derivedDataPath native/build/dd \
            -resultBundlePath native/build/runs/ci/ui-smoke.xcresult \
            -only-testing:AnycastUITests \
            test-without-building

      - name: Upload unit test result bundle
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-unit-tests-xcresult
          path: native/build/runs/ci/unit-tests.xcresult
          if-no-files-found: ignore

      - name: Upload UI smoke result bundle
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-ui-smoke-xcresult
          path: native/build/runs/ci/ui-smoke.xcresult
          if-no-files-found: ignore
