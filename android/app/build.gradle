plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def signingPropertyEncoding = keystoreProperties.getProperty('anycast.signing.encoding')
def signingProperty = { String name ->
    if (signingPropertyEncoding == null) {
        return keystoreProperties.getProperty(name)
    }
    if (signingPropertyEncoding != 'base64') {
        throw new GradleException(
            "Unsupported Android signing property encoding: ${signingPropertyEncoding}"
        )
    }

    def encodedValue = keystoreProperties.getProperty("${name}Base64")
    if (encodedValue == null) {
        throw new GradleException("Missing Base64 Android signing property: ${name}")
    }

    try {
        return new String(
            java.util.Base64.getDecoder().decode(encodedValue),
            java.nio.charset.StandardCharsets.UTF_8
        )
    } catch (IllegalArgumentException exception) {
        throw new GradleException(
            "Invalid Base64 Android signing property: ${name}",
            exception
        )
    }
}

def signingKeyAlias = signingProperty('keyAlias')
def signingKeyPassword = signingProperty('keyPassword')
def signingStoreFile = signingProperty('storeFile')
def signingStorePassword = signingProperty('storePassword')

android {
    namespace "com.kindjeff.anycast"
    compileSdkVersion flutter.compileSdkVersion
    // ndkVersion flutter.ndkVersion
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.kindjeff.anycast"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }


    signingConfigs {
        release {
            keyAlias signingKeyAlias
            keyPassword signingKeyPassword
            storeFile signingStoreFile ? file(signingStoreFile) : null
            storePassword signingStorePassword
        }
    }
    buildTypes {
        release {
            // key.properties is generated locally or by the protected release workflow.
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
